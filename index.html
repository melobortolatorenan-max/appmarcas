<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marcas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Marcas Boas e Ruins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --ink:#241C27; --muted:#6F6674; --line:#E6E1E8;
  --good:#1F7A4D; --good-soft:#E3F2EA; --bad:#B3262E; --bad-soft:#FBE7E8;
  --plum:#2B1A2E; --accent:var(--good); --accent-soft:var(--good-soft); --on:#fff;
  --r:16px;
  font-family:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000000; --surface:#241C27; --ink:#F2EDF3; --muted:#A99FB0; --line:#3A2F3E;
    --good:#4FC58A; --good-soft:#17342A; --bad:#F0777E; --bad-soft:#3E1D21; --plum:#120C14; --on:#120C14;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(32px + env(safe-area-inset-bottom));min-height:100vh}
body.bad{--accent:var(--bad);--accent-soft:var(--bad-soft)}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* login */
#auth{max-width:420px;margin:0 auto;padding:56px 24px 24px}
#auth h1{font-size:2.2rem;line-height:1.05;font-weight:800}
#auth p{color:var(--muted);margin:10px 0 28px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.field textarea{resize:vertical;min-height:70px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;font-weight:600;background:var(--plum);color:#fff}
.btn.accent{background:var(--accent);color:var(--on)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn+.btn{margin-top:10px}
.link{color:var(--muted);text-decoration:underline;padding:10px;display:block;margin:6px auto 0}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:4px 0 10px}

/* barra e botoes */
.bar{position:sticky;top:0;z-index:5;background:var(--plum);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent)}
.bar h2{font-size:1.25rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:42px;height:42px;flex:none;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.iconbtn svg{width:22px;height:22px}
.iconbtn.dark{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}

/* tela inicial */
.home{max-width:520px;margin:0 auto;padding:28px 20px}
.homeLogo{display:block;width:140px;max-width:45%;height:auto;border-radius:12px;margin:12px auto 0}
.homeTop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4.5rem 0}
.who2{display:flex;align-items:center;gap:12px;min-width:0}
.icons{display:flex;gap:8px;flex:none}
.homeTop small{color:var(--muted);font-size:.95rem}
.homeTop h1{font-size:2rem;line-height:1.1;font-weight:800;word-break:break-word}
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:130px;padding:12px 8px;border-radius:20px;color:var(--on);font-family:'Bricolage Grotesque',sans-serif;font-size:1.05rem;font-weight:800;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.big.good{background:var(--good)}
.big.bad{background:var(--bad)}
.big svg{width:40px;height:40px}

/* categorias e produtos */
.tools{padding:14px 16px 4px;max-width:620px;margin:0 auto}
.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
main{padding:8px 16px;max-width:620px;margin:0 auto}
.newbtn svg{width:24px;height:24px}
.newbtn.gray{background:#6F6674;color:#fff}
@media (prefers-color-scheme:dark){.newbtn.gray{background:#4B4351}}
.newbtn{display:flex;align-items:center;justify-content:center;width:100%;padding:16px;border-radius:18px;background:var(--accent);color:var(--on);font-weight:800;letter-spacing:.04em;margin:8px 0 16px;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.catcard{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 14px 16px;margin-bottom:12px;cursor:pointer}
.catinfo{flex:1;min-width:0}
.catinfo b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:1.15rem;overflow-wrap:anywhere}
.catinfo span{display:block;color:var(--accent);font-weight:700;font-size:.8rem;text-transform:uppercase;margin-top:3px}
.ic{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center}
.ic svg{width:26px;height:26px}
.ic.add{color:var(--good)}
.ic.edit{color:#6b8ad6}
.ic.del{color:var(--bad)}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.item b{display:block;font-weight:600}
.item .note{color:var(--muted);font-size:.92rem;margin-top:2px}
.item .price{color:var(--accent);font-weight:600;font-size:.92rem;margin-top:4px}
.item .by{color:var(--muted);font-size:.76rem;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}

/* configuracoes */
.set{padding-top:16px}
.set h3{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.k{color:var(--muted);font-size:.8rem;margin-bottom:2px}
.v{font-weight:600;word-break:break-all}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(10,5,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:1.3rem;margin-bottom:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.seg svg{width:20px;height:20px}
.seg .g.on{background:var(--good);border-color:var(--good);color:var(--on)}
.seg .b.on{background:var(--bad);border-color:var(--bad);color:var(--on)}
.listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:8px}
.listrow.on{border-color:var(--plum);box-shadow:inset 0 0 0 1px var(--plum)}
.listrow small{color:var(--muted)}
.code{font-family:'Bricolage Grotesque',sans-serif;font-size:2rem;font-weight:800;letter-spacing:.18em;text-align:center;padding:14px;border-radius:14px;background:var(--surface);border:1.5px dashed var(--muted);margin:10px 0 12px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.chk input{width:22px;height:22px;accent-color:var(--good);flex:none}
.sep{height:1px;background:var(--line);margin:20px 0}
.who{color:var(--muted);font-size:.85rem;margin:0 0 10px;word-break:break-word}

.av{border-radius:50%;background:var(--plum) center/cover no-repeat;color:#fff;display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;flex:none;overflow:hidden}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
.btnrow .newbtn{margin:0;padding:14px 8px;font-size:.85rem}
.newbtn.gray{margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.chip{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.85rem}
.chip.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.catsel{display:flex;gap:8px;align-items:stretch}
.catsel select{flex:1;min-width:0;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.catsel .iconbtn{height:auto;width:50px;color:var(--good)}
.tag{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:#fff;margin-bottom:4px}
.tag.good{background:var(--good);color:var(--on)}.tag.bad{background:var(--bad);color:var(--on)}
.item.good{border-left-color:var(--good)}.item.bad{border-left-color:var(--bad)}
.profile{display:flex;align-items:center;gap:14px}
.profile .grow{flex:1;min-width:0}
.stage{position:relative;width:280px;height:280px;margin:0 auto 14px;overflow:hidden;background:#000;touch-action:none;border-radius:12px}
.stage img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.ring{position:absolute;left:20px;top:20px;width:240px;height:240px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 400px rgba(0,0,0,.55);pointer-events:none}
.zoom{width:100%;margin-bottom:14px}
.mem{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mem .grow{flex:1;min-width:0}.mem small{color:var(--muted);display:block}
.formwrap{padding-top:16px}
.logo{display:block;width:min(240px,70%);height:auto;border-radius:16px;margin:0 auto 18px}
.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:.92rem;max-width:90vw;text-align:center}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <img class="logo" src="logo.png" alt="Marcas boas e ruins">
  <h1 class="sr">Marcas boas e ruins</h1>
  <p>As listas do casal, num lugar só. Entre para ver e editar junto.</p>
  <label class="field" id="nameField"><span>Seu nome</span><input id="aName" autocomplete="name" placeholder="Como quer aparecer na lista"></label>
  <label class="field"><span>E-mail</span><input id="aEmail" type="email" autocomplete="email" inputmode="email"></label>
  <label class="field"><span>Senha</span><input id="aPass" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></label>
  <div class="err" id="aErr"></div>
  <button class="btn" id="aGo">Entrar</button>
  <button class="btn ghost" id="aGoogle">Entrar com Google</button>
  <button class="link" id="aSwitch">Ainda não tenho conta</button>
</section>

<div id="app" class="hidden"><div id="view"></div></div>
<div id="modal"></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot,
  query, where, serverTimestamp, arrayUnion, arrayRemove, writeBatch, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4CUawMDCq8hMBdSjQSuGxzqciZz8Lb2k",
  authDomain: "marcas-boas-ruins.firebaseapp.com",
  projectId: "marcas-boas-ruins",
  storageBucket: "marcas-boas-ruins.firebasestorage.app",
  messagingSenderId: "569774940333",
  appId: "1:569774940333:web:ed69c9a65ca067ecea2624",
  measurementId: "G-4M75M1LEWY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DEFAULT_CATS = ["Vinho","Cerveja","Refrigerante","Suco","Congelado","Sushi","Lanches","Comida","Diversos","Cápsulas de café"];
const DEFAULT_PLACES = ["Supermercado","Mercado","Atacadão","Adega","Padaria","Loja online","Feira"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const byName = (a,b) => a.name.localeCompare(b.name);
const catOf = i => i.category || "Sem categoria";
const brl = n => Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const typeName = t => t==="good" ? "Marcas boas" : "Marcas ruins";
function parsePrice(s){
  s = String(s||"").trim().replace(/[R$\s]/g,"");
  if(!s) return null;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const n = parseFloat(s);
  return Number.isFinite(n) && n >= 0 ? n : NaN;
}
const ls = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} }
};

let user = null, lists = [], listId = null, items = [];
let view = "home", curType = "good", curCat = null, q = "", depth = 0;
let unsubLists = null, unsubItems = null, watchedId = null;
let signup = false, formCtx = null, profDraft = null;
const myDeleted = new Set();
const synced = new Set();

const SV = (inner, extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
const THUMB = '<path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3zM7 11l4-8a2.5 2.5 0 0 1 2.5 2.5V9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/>';
const ICON_UP = SV(THUMB);
const ICON_DOWN = SV(THUMB,'style="transform:scaleY(-1)"');
const ICON_GEAR = SV('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>');
const ICON_BACK = SV('<path d="M15 18l-6-6 6-6"/>');
const ICON_ADD = SV('<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>');
const ICON_EDIT = SV('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>');
const ICON_TRASH = SV('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>');
const ICON_SHARE = SV('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>');
const ICON_SEARCH = SV('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>');
const ICON_USERS = SV('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>');
const ICON_BELL = SV('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>');
const ICON_DL = SV('<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>');
const ICON_X = SV('<path d="M18 6L6 18M6 6l12 12"/>');

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hidden"),2800)}
const myName = () => user?.displayName || (user?.email||"").split("@")[0] || "";
const curList = () => lists.find(l=>l.id===listId);
function allowedCats(){
  const l = curList();
  if(!l || l.ownerId===user.uid) return null;
  const a = l.access?.[user.uid];
  return Array.isArray(a) ? a : null;
}
function visible(){
  const a = allowedCats();
  return a ? items.filter(i=>a.includes(catOf(i))) : items;
}
function catsFor(type, withDefaults){
  const l = curList(), a = allowedCats();
  const set = new Set(visible().filter(i=>i.type===type).map(catOf));
  (l?.cats||[]).forEach(s=>{
    const k = s.indexOf(":"); if(k<0) return;
    const t = s.slice(0,k), n = s.slice(k+1);
    if(t===type && (!a || a.includes(n))) set.add(n);
  });
  if(withDefaults && !a) DEFAULT_CATS.forEach(c=>set.add(c));
  return [...set].sort((x,y)=>x.localeCompare(y));
}

/* ---------- foto e perfil ---------- */
function myPhoto(){
  const v = ls.get("marcas:photo:"+user.uid);
  if(v!==null) return v || null;
  for(const l of lists){ const p = l.memberInfo?.[user.uid]?.photo; if(p) return p; }
  return null;
}
function avatar(photo,name,size){
  const ini = esc((name||"?").trim().charAt(0).toUpperCase());
  return `<div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;${photo?`background-image:url('${photo}')`:""}">${photo?"":ini}</div>`;
}
function syncMyInfo(){
  if(!user) return;
  const info = {name:myName(), photo:myPhoto()};
  lists.forEach(l=>{
    const m = l.memberInfo?.[user.uid];
    if(m && m.name===info.name && (m.photo||null)===info.photo) return;
    const key = l.id+"|"+info.name+"|"+(info.photo||"").length;
    if(synced.has(key)) return; synced.add(key);
    updateDoc(doc(db,"lists",l.id),{[`memberInfo.${user.uid}`]:info}).catch(e=>console.error(e));
  });
}
function openProfile(){
  const photo = myPhoto();
  showSheet(`
    <h2>Editar perfil</h2>
    <div style="display:flex;justify-content:center;margin-bottom:14px">${avatar(photo,myName(),96)}</div>
    <input type="file" accept="image/*" id="pFile" class="hidden">
    <button class="btn ghost" id="pPick">Escolher foto da galeria</button>
    ${photo?`<button class="btn ghost" id="pRem">Remover foto</button>`:""}
    <label class="field" style="margin-top:16px"><span>Seu nome</span><input id="pName" value="${esc(profDraft ?? myName())}" autocomplete="name"></label>
    <div class="err" id="pErr"></div>
    <button class="btn accent" id="pSave">Salvar</button>`);
  $("#pPick").onclick = () => $("#pFile").click();
  $("#pFile").onchange = e => { const f = e.target.files[0]; if(f){ profDraft = $("#pName").value; openCropper(f); } };

function openCropper(file){
  const url = URL.createObjectURL(file), im = new Image();
  im.onerror = () => { toast("Não foi possível abrir essa imagem"); openProfile(); };
  im.onload = () => {
    const S=280, D=240, w=im.naturalWidth, h=im.naturalHeight;
    const min = D/Math.min(w,h), max = min*4;
    let s=min, cx=S/2, cy=S/2;
    showSheet(`
      <h2>Ajustar foto</h2>
      <p class="who">Arraste e use o zoom. O que estiver dentro do círculo é o que vai aparecer.</p>
      <div class="stage" id="stage"><img id="cImg" src="${url}" alt=""><div class="ring"></div></div>
      <input class="zoom" id="zoom" type="range" min="0" max="100" value="0" aria-label="Zoom">
      <button class="btn accent" id="cSave">Usar esta foto</button>
      <button class="btn ghost" id="cBack">Voltar</button>`);
    const img = $("#cImg"), stage = $("#stage"), zoom = $("#zoom");
    const clampAll = () => {
      s = Math.min(max,Math.max(min,s));
      const mx = Math.max(0,(w*s-D)/2), my = Math.max(0,(h*s-D)/2);
      cx = Math.min(S/2+mx,Math.max(S/2-mx,cx)); cy = Math.min(S/2+my,Math.max(S/2-my,cy));
    };
    const draw = () => {
      clampAll();
      img.style.width = w*s+"px"; img.style.height = h*s+"px";
      img.style.left = (cx-w*s/2)+"px"; img.style.top = (cy-h*s/2)+"px";
      zoom.value = Math.round((s/min-1)/3*100);
    };
    draw();
    zoom.oninput = () => { s = min*(1+zoom.value/100*3); draw(); };
    const ptrs = new Map();
    stage.onpointerdown = e => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); };
    stage.onpointermove = e => {
      const p = ptrs.get(e.pointerId); if(!p) return;
      if(ptrs.size===1){ cx += e.clientX-p.x; cy += e.clientY-p.y; }
      else if(ptrs.size===2){
        const o = [...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
        const d0 = Math.hypot(p.x-o.x,p.y-o.y), d1 = Math.hypot(e.clientX-o.x,e.clientY-o.y);
        if(d0>0) s *= d1/d0;
      }
      p.x=e.clientX; p.y=e.clientY; draw();
    };
    stage.onpointerup = stage.onpointercancel = e => ptrs.delete(e.pointerId);
    stage.onwheel = e => { e.preventDefault(); s *= e.deltaY<0 ? 1.06 : .94; draw(); };
    $("#cBack").onclick = () => { URL.revokeObjectURL(url); openProfile(); };
    $("#cSave").onclick = () => {
      const c = document.createElement("canvas"); c.width=c.height=192;
      const g = c.getContext("2d");
      const left = cx-w*s/2, top = cy-h*s/2;
      g.drawImage(im,((S-D)/2-left)/s,((S-D)/2-top)/s,D/s,D/s,0,0,192,192);
      ls.set("marcas:photo:"+user.uid,c.toDataURL("image/jpeg",.85));
      URL.revokeObjectURL(url); syncMyInfo(); toast("Foto atualizada");
      openProfile(); shell();
    };
  };
  im.src = url;
}

function startLists(){
  unsubLists?.();
  unsubLists = onSnapshot(query(collection(db,"lists"),where("members","array-contains",user.uid)), snap => {
    lists = snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
    if(!lists.length){
      listId=null; items=[]; unsubItems?.(); watchedId=null; refresh();
      if(!startLists.asked){ startLists.asked=true; openAddList(); }
      return;
    }
    const saved = ls.get("marcas:list");
    if(!lists.find(l=>l.id===listId)) listId = lists.find(l=>l.id===saved)?.id || lists[0].id;
    watchItems(); syncMyInfo(); refresh();
  }, e => console.error(e));
}
function watchItems(){
  if(!listId) return;
  if(watchedId===listId && unsubItems) return;
  unsubItems?.(); watchedId=listId;
  let first = true;
  unsubItems = onSnapshot(collection(db,"lists",listId,"items"), snap => {
    items = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!first) notifyChanges(snap.docChanges());
    first = false;
    refresh();
  });
}
function selectList(id){
  listId=id; ls.set("marcas:list",id); watchedId=null; items=[]; watchItems(); refresh();
}
function genCode(){
  const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)];
  return s;
}
async function createList(name){
  name = name.trim(); if(!name) return false;
  try{
    const code = genCode();
    const ref = await addDoc(collection(db,"lists"),{name,ownerId:user.uid,members:[user.uid],code,cats:[],
      memberInfo:{[user.uid]:{name:myName(),photo:myPhoto()}},createdAt:serverTimestamp()});
    await setDoc(doc(db,"invites",code),{listId:ref.id,categories:null,createdBy:user.uid});
    ls.set("marcas:list",ref.id); listId=ref.id;
    toast("Lista criada"); return true;
  }catch(e){ console.error(e); toast("Não foi possível criar a lista"); return false; }
}
async function joinByCode(code){
  code = String(code||"").trim().toUpperCase(); if(!code) return false;
  try{
    const inv = await getDoc(doc(db,"invites",code));
    if(!inv.exists()){ toast("Código não encontrado"); return false; }
    const {listId:id, categories} = inv.data();
    const ex = lists.find(l=>l.id===id);
    const cur = ex?.access?.[user.uid];
    if(ex && (ex.ownerId===user.uid || !cur || cur==="all")){
      selectList(id); toast("Você já está nessa lista"); toHome(); return true;
    }
    let acc = Array.isArray(categories) ? categories : "all";
    if(ex && Array.isArray(cur) && Array.isArray(acc)) acc = [...new Set([...cur,...acc])];
    await updateDoc(doc(db,"lists",id),{members:arrayUnion(user.uid),[`access.${user.uid}`]:acc,
      [`memberInfo.${user.uid}`]:{name:myName(),photo:myPhoto()}});
    ls.set("marcas:list",id); listId=id; watchedId=null;
    toast("Você entrou na lista"); toHome(); return true;
  }catch(e){ console.error(e); toast("Não foi possível entrar na lista"); return false; }
}

/* ---------- NOTIFICAÇÕES ---------- */
function notifSupported(){ return "Notification" in window; }
function sendNotif(title,body,tag){
  if(!document.hidden){ toast(body); return; }
  if(!notifSupported() || Notification.permission!=="granted") return;
  const opts = {body,icon:"icon-192.png",badge:"icon-192.png",tag};
  if(navigator.serviceWorker?.ready) navigator.serviceWorker.ready.then(r=>r.showNotification(title,opts)).catch(()=>{ try{ new Notification(title,opts) }catch{} });
  else { try{ new Notification(title,opts) }catch{} }
}
function notifyChanges(changes){
  const a = allowedCats(), msgs = [];
  changes.forEach(ch=>{
    if(ch.type==="modified") return;
    const d = ch.doc.data();
    if(a && !a.includes(catOf(d))) return;
    const where = `${typeName(d.type)} › ${catOf(d)}`;
    if(ch.type==="added"){
      if(ch.doc.metadata.hasPendingWrites || d.addedBy===user.uid) return;
      msgs.push(`${d.addedByName||"Alguém"} adicionou “${d.name}” em ${where}`);
    } else if(ch.type==="removed"){
      if(myDeleted.has(ch.doc.id)){ myDeleted.delete(ch.doc.id); return; }
      msgs.push(`“${d.name}” foi removido de ${where}`);
    }
  });
  if(!msgs.length) return;
  const l = curList();
  if(msgs.length>3) sendNotif("Marcas boas e ruins",`${msgs.length} alterações na lista “${l?.name||""}”`,"multi");
  else msgs.forEach((m,i)=>sendNotif("Marcas boas e ruins",m,"chg"+Date.now()+i));
}

  if(!n || n===c) return;
  const l = curList();
  try{
    const b = writeBatch(db);
    items.filter(i=>i.type===curType && catOf(i)===c).forEach(i=>b.update(doc(db,"lists",listId,"items",i.id),{category:n}));
    const upd = {cats:[...new Set([...(l.cats||[]).filter(x=>x!==`${curType}:${c}`),`${curType}:${n}`])]};
    if(l.ownerId===user.uid && l.access){
      const acc = {}; Object.entries(l.access).forEach(([u,v])=>{ acc[u] = Array.isArray(v) ? v.map(x=>x===c?n:x) : v; });
      upd.access = acc;
    }
    b.update(doc(db,"lists",listId),upd);
    await b.commit(); toast("Categoria renomeada");
  }catch(e){ console.error(e); toast("Não foi possível renomear"); }
}
async function deleteCat(c){
  const mine = items.filter(i=>i.type===curType && catOf(i)===c);
  if(!confirm(`Excluir a categoria “${c}” e os ${mine.length} produto(s) dela?`)) return;
  const l = curList();
  try{
    const b = writeBatch(db);
    mine.forEach(i=>{ myDeleted.add(i.id); b.delete(doc(db,"lists",listId,"items",i.id)); });
    b.update(doc(db,"lists",listId),{cats:(l.cats||[]).filter(x=>x!==`${curType}:${c}`)});
    await b.commit(); toast("Categoria excluída");
  }catch(e){ console.error(e); toast("Não foi possível excluir"); }
}

/* ---------- FORMULÁRIO DE PRODUTO (tela cheia) ---------- */
function openForm(it,preset){
  const a = allowedCats();
  formCtx = {it, preset, type: it?.type || curType, extra:new Set(), allowed:a};
  go("form");
}
function drawForm(){
  const {it,preset} = formCtx, isNew = !it;
  let type = formCtx.type;
  const catVal = it ? (it.category||"") : (preset && preset!=="Sem categoria" ? preset : "");
  const priceVal = it?.price!=null ? String(it.price).replace(".",",") : "";
  const usedPlaces = items.map(i=>i.place).filter(Boolean);
  const places = [...new Set([...usedPlaces,...DEFAULT_PLACES])].slice(0,10);
  $("#view").innerHTML = `
    <header class="bar">
      <button class="iconbtn" id="back" aria-label="Voltar">${ICON_BACK}</button>
      <h2>${isNew?"Adicionar produto":"Editar produto"}</h2>
    </header>
    <main class="formwrap">
      <div class="seg">
        <button class="g" id="tG">${ICON_UP} Boa</button>
        <button class="b" id="tB">${ICON_DOWN} Ruim</button>
      </div>
      <label class="field"><span>Produto ou marca</span><input id="fName" value="${esc(it?.name||"")}" placeholder="Ex.: Vinho Balduzzi" autocomplete="off"></label>
      <div class="field"><span>Categoria</span>
        <div class="catsel"><select id="fCat"></select>
        <button class="iconbtn dark" id="fNewCat" type="button" aria-label="Adicionar categoria">${ICON_ADD}</button></div>
      </div>
      <label class="field"><span>Local de compra (opcional)</span><input id="fPlace" value="${esc(it?.place||"")}" placeholder="Ex.: Atacadão, Adega Central" autocomplete="off"></label>
      <div class="chips" id="chips">${places.map(p=>`<button type="button" class="chip" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
      <label class="field"><span>Valor pago (opcional)</span><input id="fPrice" inputmode="decimal" value="${esc(priceVal)}" placeholder="Ex.: 12,90" autocomplete="off"></label>
      <label class="field"><span>Observação (opcional)</span><textarea id="fNote" placeholder="Ex.: muito doce, aguado, não é dos melhores">${esc(it?.note||"")}</textarea></label>
      <div class="err" id="fErr"></div>
      <button class="btn accent" id="fSave">Salvar</button>
      ${isNew?"":`<button class="btn danger" id="fDel">Excluir produto</button>`}
    </main>`;
  let selected = catVal;
  const fillCats = () => {
    const set = new Set([...catsFor(type,true),...formCtx.extra]);
    if(selected) set.add(selected);
    const arr = [...set].sort((x,y)=>x.localeCompare(y));
    $("#fCat").innerHTML = `<option value="">Sem categoria</option>` + arr.map(c=>`<option value="${esc(c)}" ${c===selected?"selected":""}>${esc(c)}</option>`).join("");
  };
  const paint = () => {
    formCtx.type = type;
    document.body.classList.toggle("bad",type==="bad");
    $("#tG").classList.toggle("on",type==="good"); $("#tB").classList.toggle("on",type==="bad");
    $("#fSave").style.background = type==="good" ? "var(--good)" : "var(--bad)";
    fillCats();
  };
  paint();
  $("#fCat").onchange = e => { selected = e.target.value; };
  $("#tG").onclick = () => { type="good"; paint(); };
  $("#tB").onclick = () => { type="bad"; paint(); };
  $("#back").onclick = () => goBack("home");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ $("#fPlace").value = b.dataset.p; });
  $("#fNewCat").onclick = async () => {
    const n = await addCategory(type);
    if(n){ formCtx.extra.add(n); selected = n; fillCats(); }
  };
  if(isNew) setTimeout(()=>$("#fName").focus(),80);
  $("#fSave").onclick = async () => {
    const name = $("#fName").value.trim();
    if(!name){ $("#fErr").textContent="Digite o nome do produto."; return; }
    const price = parsePrice($("#fPrice").value);
    if(Number.isNaN(price)){ $("#fErr").textContent="Valor pago inválido. Use números, ex.: 12,90."; return; }
    const data = {name, type, category:selected, place:$("#fPlace").value.trim(), note:$("#fNote").value.trim(), price};
    try{
      await ensureAccess(selected);
      if(isNew){
        await addDoc(collection(db,"lists",listId,"items"),{...data,addedBy:user.uid,addedByName:user.displayName||user.email,createdAt:serverTimestamp()});
      } else {
        await updateDoc(doc(db,"lists",listId,"items",it.id),{...data,editedByName:user.displayName||user.email});
      }
      toast("Produto salvo"); formCtx=null; goBack("home");
    }catch(e){ console.error(e); $("#fErr").textContent="Não foi possível salvar. Verifique a conexão."; }
  };
  if(!isNew) $("#fDel").onclick = async () => {
    if(!confirm(`Excluir “${it.name}”?`)) return;
    try{ myDeleted.add(it.id); await deleteDoc(doc(db,"lists",listId,"items",it.id)); formCtx=null; goBack("home"); }
    catch(e){ console.error(e); toast("Não foi possível excluir"); }
  };
}

      <button class="iconbtn" id="back" aria-label="Voltar">${ICON_BACK}</button>
      <h2>Configurações</h2>
    </header>
    <main class="set">
      <div class="card profile">
        <button id="avBtn" aria-label="Mudar foto" style="border-radius:50%">${avatar(myPhoto(),myName(),64)}</button>
        <div class="grow"><div class="k">Nome</div><div class="v">${esc(myName())}</div>
          <div class="k" style="margin-top:6px">E-mail cadastrado</div><div class="v" style="font-size:.9rem">${esc(user.email||"")}</div></div>
        <button class="iconbtn dark" id="pen" aria-label="Editar perfil">${ICON_EDIT}</button>
      </div>
      <div class="card row">
        <div><div class="v">Compartilhar categorias</div><div class="k">Escolha uma, várias ou todas</div></div>
        <button class="iconbtn dark" id="shareCats" aria-label="Compartilhar categorias">${ICON_SHARE}</button>
      </div>
      <div class="card row">
        <div><div class="v">Compartilhamentos</div><div class="k">Com quem e quais categorias</div></div>
        <button class="iconbtn dark" id="shares" aria-label="Ver compartilhamentos">${ICON_USERS}</button>
      </div>
      <div id="extras"></div>
      <div class="sep"></div>

      <div id="listsBlock"></div>

      <button class="btn ghost" id="lOut">Sair da conta</button>
    </main>`;
  $("#back").onclick = () => goBack("home");
  $("#pen").onclick = $("#avBtn").onclick = () => { profDraft=null; openProfile(); };
  $("#shareCats").onclick = openShare;
  $("#shares").onclick = () => go("shares");
  $("#lOut").onclick = () => signOut(auth);
  renderExtras(); renderListsBlock();
}
function renderExtras(){
  const el = $("#extras"); if(!el) return;
  let nState = "Não disponível neste navegador", nBtn = "";
  if(notifSupported()){
    const p = Notification.permission;
    nState = p==="granted" ? "Ativadas" : p==="denied" ? "Bloqueadas nas configurações do navegador" : "Avisa quando alguém adiciona ou remove produtos";
    nBtn = p==="default" ? `<button class="iconbtn dark" id="nBtn" aria-label="Ativar notificações">${ICON_BELL}</button>` : "";
  }
  const inst = isStandalone() ? "App já instalado" : "Adicionar à tela inicial do celular";
  el.innerHTML = `
    <div class="card row"><div><div class="v">Notificações</div><div class="k">${nState}</div></div>${nBtn}</div>
    ${isStandalone()?"":`<div class="card row"><div><div class="v">Instalar o app</div><div class="k">${inst}</div></div><button class="iconbtn dark" id="iBtn" aria-label="Instalar">${ICON_DL}</button></div>`}`;
  $("#nBtn")?.addEventListener("click", async () => {
    const r = await Notification.requestPermission();
    toast(r==="granted" ? "Notificações ativadas" : "Notificações não permitidas");
    renderExtras();
  });
  $("#iBtn")?.addEventListener("click", async () => {
    if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; renderExtras(); return; }
    showSheet(`
      <h2>Instalar o app</h2>
      <p class="who"><b>Android (Chrome):</b> toque nos três pontinhos ⋮ no canto e escolha “Instalar app” ou “Adicionar à tela inicial”.</p>
      <p class="who"><b>iPhone (Safari):</b> toque em Compartilhar e depois em “Adicionar à Tela de Início”.</p>
      <button class="btn ghost" id="iClose">Fechar</button>`);
    $("#iClose").onclick = closeModal;
  });
}
function renderListsBlock(){
  const el = $("#listsBlock"); if(!el) return;
  el.innerHTML = lists.length ? lists.map(x=>`
    <button class="listrow ${x.id===listId?"on":""}" data-id="${x.id}">
      <span><b>${esc(x.name)}</b><br><small>${x.members.length} ${x.members.length===1?"pessoa":"pessoas"}</small></span>
      <span>${x.id===listId?"✓":""}</span>
    </button>`).join("") : `<p class="who">Nenhuma lista ainda. Volte à tela inicial e toque em “Adicionar lista”.</p>`;
  el.querySelectorAll(".listrow").forEach(b=>b.onclick=()=>{ selectList(b.dataset.id); toast("Lista selecionada"); });
}

/* ---------- COMPARTILHAMENTOS ---------- */
function drawShares(){
  $("#view").innerHTML = `
    <header class="bar">
      <button class="iconbtn" id="back" aria-label="Voltar">${ICON_BACK}</button>
      <h2>Compartilhamentos</h2>
    </header>
    <main class="set"><div id="content"></div></main>`;
  $("#back").onclick = () => goBack("settings");
  renderShares();
}
function renderShares(){
  const el = $("#content"); if(!el) return;
  if(!lists.length){ el.innerHTML = `<div class="empty"><b>Nenhuma lista ainda</b>Adicione uma lista na tela inicial.</div>`; return; }
  el.innerHTML = lists.map(l=>{
    const mine = l.ownerId===user.uid;
    const ownerName = l.memberInfo?.[l.ownerId]?.name || "o dono";
    const rows = l.members.map(uid=>{
      const info = l.memberInfo?.[uid] || {};
      const name = uid===user.uid ? myName() : (info.name || "Pessoa");
      const photo = uid===user.uid ? myPhoto() : info.photo;
      const acc = l.access?.[uid];
      const sub = uid===l.ownerId ? "Dono da lista · todas as categorias"
        : Array.isArray(acc) ? "Categorias: "+(acc.length?acc.join(", "):"nenhuma") : "Todas as categorias";
      const canRemove = mine && uid!==user.uid;
      return `<div class="mem">${avatar(photo,name,40)}<div class="grow"><b>${esc(name)}${uid===user.uid?" (você)":""}</b><small>${esc(sub)}</small></div>
        ${canRemove?`<button class="iconbtn dark" data-rm="${l.id}|${uid}|${esc(name)}" aria-label="Remover ${esc(name)}">${ICON_X}</button>`:""}</div>`;
    }).join("");
    return `<div class="card"><h3>${esc(l.name)}</h3>
      <p class="who">${mine?"Você é o dono desta lista.":"Compartilhada com você por "+esc(ownerName)+"."} ${l.members.length} ${l.members.length===1?"pessoa":"pessoas"}.</p>${rows}</div>`;
  }).join("");
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
    const [id,uid,name] = b.dataset.rm.split("|");
    removeMember(lists.find(x=>x.id===id),uid,name);
  });
}

/* ---------- MODAIS ---------- */
function closeModal(){ $("#modal").innerHTML=""; }
function showSheet(html){
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeModal(); });
}

function openShare(){
  const l = curList();
  if(!l){ toast("Crie uma lista primeiro"); return; }
  if(l.ownerId!==user.uid){ toast("Só quem criou a lista pode compartilhar"); return; }
  const cats = [...new Set([...catsFor("good",false),...catsFor("bad",false)])].sort((a,b)=>a.localeCompare(b));
  if(!cats.length){ toast("Cadastre categorias antes de compartilhar"); return; }
  showSheet(`
    <h2>Compartilhar categorias</h2>
    <p class="who">Escolha o que a outra pessoa poderá ver e editar.</p>
    <label class="chk"><input type="checkbox" id="cAll" checked><b>Todas as categorias</b></label>
    ${cats.map(c=>`<label class="chk"><input type="checkbox" class="cOne" value="${esc(c)}" checked><span>${esc(c)}</span></label>`).join("")}
    <div class="err" id="sErr"></div>
    <button class="btn accent" id="sGo">Gerar código</button>
    <button class="btn ghost" id="sCancel">Cancelar</button>`);
  const ones = () => [...document.querySelectorAll("#modal .cOne")];
  $("#cAll").onchange = e => ones().forEach(b=>b.checked=e.target.checked);
  ones().forEach(b=>b.onchange = () => { $("#cAll").checked = ones().every(x=>x.checked); });
  $("#sCancel").onclick = closeModal;
  $("#sGo").onclick = async () => {
    const sel = ones().filter(b=>b.checked).map(b=>b.value);
    if(!sel.length){ $("#sErr").textContent="Escolha pelo menos uma categoria."; return; }
    const all = sel.length===cats.length;
    const code = genCode();
    try{
      await setDoc(doc(db,"invites",code),{listId:l.id,categories:all?null:sel,createdBy:user.uid});
    }catch(e){ console.error(e); $("#sErr").textContent="Não foi possível gerar o código. Verifique a conexão."; return; }
    const link = `${location.origin}${location.pathname}?codigo=${code}`;
    showSheet(`
      <h2>Código gerado</h2>
      <p class="who">${all?"Todas as categorias.":"Categorias: "+esc(sel.join(", "))+"."} Quem entrar com este código acessa essas categorias da lista “${esc(l.name)}”.</p>
      <div class="code">${esc(code)}</div>
      <button class="btn accent" id="rWa">Enviar pelo WhatsApp</button>
      <button class="btn ghost" id="rCopy">Copiar link</button>
      <button class="btn ghost" id="rClose">Fechar</button>`);
    $("#rWa").onclick = () => window.open(`https://wa.me/?text=${encodeURIComponent(`Entra na lista “${l.name}”: ${link}\nCódigo: ${code}`)}`,"_blank");
    $("#rCopy").onclick = async () => { try{await navigator.clipboard.writeText(link);toast("Link copiado")}catch{toast("Código: "+code)} };
    $("#rClose").onclick = closeModal;
  };
}
